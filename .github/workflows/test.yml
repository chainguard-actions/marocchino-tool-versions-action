name: "test-local"
on:
  pull_request:
  push:
    branches:
      - master
      - "releases/*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./
        id: versions
        with:
          path: ".tool-versions"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
      - run: npm ci
      - run: npm run all
