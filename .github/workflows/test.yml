name: "test-local"
on:
  pull_request:
  push:
    branches:
      - master
      - "releases/*"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./
        id: versions
        with:
          path: ".tool-versions"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
      - run: npm ci
      - run: npm test
