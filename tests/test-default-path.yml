name: Test default path (.tool-versions in workspace)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .tool-versions in workspace root
        run: |
          cat > "$GITHUB_WORKSPACE/.tool-versions" << 'EOF'
          nodejs 16.20.0
          ruby 3.1.4
          EOF

      - id: action
        uses: .
        # uses default path: .tool-versions

      - name: Assert nodejs output using default path
        env:
          ACTUAL: ${{ steps.action.outputs.nodejs }}
        run: |
          echo "actual nodejs: $ACTUAL"
          if [ "$ACTUAL" != "16.20.0" ]; then
            echo "FAIL: expected nodejs '16.20.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: nodejs=$ACTUAL"

      - name: Assert ruby output using default path
        env:
          ACTUAL: ${{ steps.action.outputs.ruby }}
        run: |
          echo "actual ruby: $ACTUAL"
          if [ "$ACTUAL" != "3.1.4" ]; then
            echo "FAIL: expected ruby '3.1.4' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: ruby=$ACTUAL"
