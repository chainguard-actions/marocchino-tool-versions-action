name: Test custom path for .tool-versions file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .tool-versions file at custom path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/subdir"
          echo "ruby 2.7.4" > "$GITHUB_WORKSPACE/subdir/.tool-versions"

      - id: action
        uses: .
        with:
          path: "subdir/.tool-versions"

      - name: Assert ruby output from custom path
        env:
          ACTUAL: ${{ steps.action.outputs.ruby }}
        run: |
          echo "actual ruby: $ACTUAL"
          if [ "$ACTUAL" != "2.7.4" ]; then
            echo "FAIL: expected '2.7.4' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
