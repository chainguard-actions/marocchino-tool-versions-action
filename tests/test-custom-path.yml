name: Test custom path for tool-versions file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create tool-versions file at custom path
        run: |
          mkdir -p myproject
          echo "nodejs 16.20.0" > myproject/.tool-versions

      - id: action
        uses: .
        with:
          path: myproject/.tool-versions

      - name: Assert nodejs output from custom path
        env:
          ACTUAL: ${{ steps.action.outputs.nodejs }}
        run: |
          echo "actual nodejs: $ACTUAL"
          if [ "$ACTUAL" != "16.20.0" ]; then
            echo "FAIL: expected '16.20.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: custom path correctly resolved"
