name: Test partial tool versions (only some tools present)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .tool-versions file with only elixir and erlang
        run: |
          cat > .tool-versions <<'EOF'
          elixir 1.14.0
          erlang 25.3.2
          EOF
      - id: action
        uses: .
        with:
          path: '.tool-versions'
      - name: Assert elixir output
        env:
          ACTUAL: ${{ steps.action.outputs.elixir }}
        run: |
          echo "actual elixir: $ACTUAL"
          if [ "$ACTUAL" != "1.14.0" ]; then
            echo "FAIL: expected elixir '1.14.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS elixir"
      - name: Assert erlang output
        env:
          ACTUAL: ${{ steps.action.outputs.erlang }}
        run: |
          echo "actual erlang: $ACTUAL"
          if [ "$ACTUAL" != "25.3.2" ]; then
            echo "FAIL: expected erlang '25.3.2', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS erlang"
      - name: Assert nodejs output is empty when not in file
        env:
          ACTUAL: ${{ steps.action.outputs.nodejs }}
        run: |
          echo "actual nodejs: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected nodejs to be empty, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS nodejs is empty"
      - name: Assert ruby output is empty when not in file
        env:
          ACTUAL: ${{ steps.action.outputs.ruby }}
        run: |
          echo "actual ruby: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected ruby to be empty, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS ruby is empty"
