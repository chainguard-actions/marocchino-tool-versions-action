name: Test basic tool versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .tool-versions file
        run: |
          cat > /tmp/tool-versions-basic << 'EOF'
          nodejs 18.17.0
          ruby 3.2.2
          terraform 1.5.0
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/tool-versions-basic

      - name: Assert nodejs output
        env:
          ACTUAL: ${{ steps.action.outputs.nodejs }}
        run: |
          echo "actual nodejs: $ACTUAL"
          if [ "$ACTUAL" != "18.17.0" ]; then
            echo "FAIL: expected nodejs '18.17.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: nodejs=$ACTUAL"

      - name: Assert ruby output
        env:
          ACTUAL: ${{ steps.action.outputs.ruby }}
        run: |
          echo "actual ruby: $ACTUAL"
          if [ "$ACTUAL" != "3.2.2" ]; then
            echo "FAIL: expected ruby '3.2.2' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: ruby=$ACTUAL"

      - name: Assert terraform output
        env:
          ACTUAL: ${{ steps.action.outputs.terraform }}
        run: |
          echo "actual terraform: $ACTUAL"
          if [ "$ACTUAL" != "1.5.0" ]; then
            echo "FAIL: expected terraform '1.5.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: terraform=$ACTUAL"
