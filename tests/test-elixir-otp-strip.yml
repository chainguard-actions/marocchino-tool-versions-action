name: Test elixir OTP suffix stripping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .tool-versions file with elixir OTP version
        run: |
          echo "elixir 1.15.0-otp-26" > /tmp/tool-versions-elixir
      - id: action
        uses: .
        with:
          path: /tmp/tool-versions-elixir
      - name: Assert elixir output strips OTP suffix
        env:
          ACTUAL: ${{ steps.action.outputs.elixir }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "1.15.0" ]; then
            echo "FAIL: expected '1.15.0' (OTP suffix stripped), got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
